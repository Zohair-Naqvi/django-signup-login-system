<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-blue-50 flex items-center justify-center">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

        <!-- Heading -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-blue-600 rounded-full mx-auto flex items-center justify-center mb-4">
                <span class="text-white text-2xl font-bold">Z</span>
            </div>

            <h1 class="text-3xl font-bold text-blue-900">
                Welcome
            </h1>

            <p class="text-blue-500 mt-2">
                Login to your account
            </p>
        </div>

        <!-- Login Form -->
        <form method="POST" >
            {% csrf_token  %}

            <!-- Email -->
            <div class="mb-5">
                <label class="block text-blue-900 font-medium mb-2">
                    username or email
                </label>

                <input
                    type="text"
                    placeholder="Enter your username or email"
                    name="username"
                    class="w-full px-4 py-3 border border-blue-200 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500"
                >
            </div>

            <!-- Password -->
            <div class="mb-5">
                <label class="block text-blue-900 font-medium mb-2">
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    name="password"
                    class="w-full px-4 py-3 border border-blue-200 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500"
                >
            </div>

            <!-- Remember + Forgot -->
            <div class="flex items-center justify-between mb-6">

                <label class="flex items-center text-sm text-blue-700">
                    <input type="checkbox" class="mr-2 accent-blue-600">
                    Remember me
                </label>

                <a href="#" class="text-sm text-blue-600 hover:text-blue-800">
                    Forgot Password?
                </a>

            </div>

            <!-- Login Button -->
            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700
                       text-white font-semibold py-3 rounded-lg
                       transition duration-200"
            >
                Login
            </button>

        </form>

        <!-- Register -->
        <p class="text-center text-sm text-blue-700 mt-6">
            Don't have an account?
            <a href="{% url 'signup' %}" class="font-semibold text-blue-600 hover:text-blue-800">
                Sign Up
            </a>
        </p>

    </div>

</body>
</html>
