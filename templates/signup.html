
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-blue-50 flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-8">

        <h1 class="text-3xl font-bold text-blue-900 text-center mb-2">
            Create Account
        </h1>

        <p class="text-gray-500 text-center mb-6">
            Sign up to get started
        </p>

        {% if error %}
            <p class="bg-red-100 text-red-700 p-3 rounded-lg mb-4">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-blue-900 mb-2">
                    Username
                </label>
                <input
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    required
                    class="w-full border border-blue-200 rounded-lg px-4 py-3"
                >
            </div>

            <div class="mb-4">
                <label class="block text-blue-900 mb-2">
                    Email
                </label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    class="w-full border border-blue-200 rounded-lg px-4 py-3"
                >
            </div>

            <div class="mb-4">
                <label class="block text-blue-900 mb-2">
                    Password
                </label>
                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                    class="w-full border border-blue-200 rounded-lg px-4 py-3"
                >
            </div>

            <div class="mb-6">
                <label class="block text-blue-900 mb-2">
                    Confirm Password
                </label>
                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                    class="w-full border border-blue-200 rounded-lg px-4 py-3"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700
                       text-white font-semibold py-3 rounded-lg
                       transition duration-200"
            >
                Sign Up
            </button>
        </form>

        <p class="text-center text-gray-600 mt-6">
            Already have an account?
            <a href="{% url 'login' %}"
               class="text-blue-600 hover:text-blue-800 font-semibold">
                Sign In
            </a>
        </p>

    </div>

</body>
</html>
