
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>Logged Out</title>
</head>

<body class="min-h-screen bg-blue-50 flex items-center justify-center">

    <div class="bg-white w-full max-w-md mx-4 p-8 rounded-2xl
                shadow-xl text-center">

        <!-- Logout Icon -->
        <div class="w-20 h-20 bg-blue-100 rounded-full
                    flex items-center justify-center mx-auto mb-6">

            <span class="text-4xl text-blue-600">✓</span>

        </div>

        <!-- Heading -->
        <h1 class="text-3xl font-bold text-blue-900 mb-3">
            Logged Out Successfully!
        </h1>

        <!-- Message -->
        <p class="text-gray-600 mb-8 leading-relaxed">
            You have successfully logged out of your account.
            Thank you for visiting. We hope to see you again!
        </p>

        <!-- Login Button -->
        <a href="/"
           class="block w-full bg-blue-600 hover:bg-blue-700
                  text-white font-semibold py-3 rounded-lg
                  transition duration-200">
            Back to Login
        </a>

        <!-- Footer -->
        <p class="text-sm text-blue-400 mt-6">
            Thank you for using MyWebsite.
        </p>

    </div>

</body>
</html>
